<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f4f2ee; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f2ee;">
      <tr>
        <td align="center" style="padding: 24px 12px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px;">
            <tr>
              <td style="padding: 0 4px 14px; font-size: 18px; font-weight: 700; color: #0f766e;">{{ app_name }}</td>
            </tr>
            <tr>
              <td style="background: #ffffff; border: 1px solid #e4e7eb; border-radius: 12px; padding: 28px 26px; font-size: 16px; line-height: 1.5;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 8px; font-size: 12px; line-height: 1.5; color: #7b8794;">
                {% block footer %}
                You are receiving this because you have a {{ app_name }} account.
                {% if settings_url %}<a href="{{ settings_url }}" style="color: #7b8794;">Email settings</a>{% endif %}
                {% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
