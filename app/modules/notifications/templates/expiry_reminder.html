<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #1f2933; max-width: 520px; margin: 0 auto; padding: 24px;">
    <p>Hi $name,</p>
    <p style="font-size: 18px; margin: 16px 0;"><strong>$headline</strong></p>
    <table style="border-collapse: collapse; margin: 16px 0;">
      <tr><td style="padding: 4px 16px 4px 0; color: #52606d;">Document</td><td>$title</td></tr>
      <tr><td style="padding: 4px 16px 4px 0; color: #52606d;">Type</td><td>$kind</td></tr>
      $vehicle_row
      <tr><td style="padding: 4px 16px 4px 0; color: #52606d;">Expires on</td><td>$expiry</td></tr>
    </table>
    <p>Renew it in time and mark it as renewed in Expiry Tracker so we can stop reminding you.</p>
    <p style="color: #7b8794; font-size: 12px;">You are receiving this because reminders are enabled for this document.</p>
  </body>
</html>
