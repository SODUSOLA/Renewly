name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: expiry_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tracker" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/expiry_tracker
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The migrations must build the schema from scratch and match the models.
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (fails below 95% coverage)
        run: pytest --cov

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: The production image builds
        run: docker build -t expiry-tracker backend
      - name: The image starts and can use every model
        run: docker run --rm -e DATABASE_URL=postgresql://x:x@localhost/x -e SECRET_KEY=x expiry-tracker python -c "import app.main; from sqlalchemy.orm import configure_mappers; configure_mappers(); print('ok')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com
      - name: The production image builds
        run: docker build --build-arg VITE_API_URL=https://api.example.com -t renewly-web .
